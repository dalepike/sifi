version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sifi-postgres
    environment:
      POSTGRES_USER: sifi
      POSTGRES_PASSWORD: sifi_dev_password
      POSTGRES_DB: sifi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifi -d sifi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
